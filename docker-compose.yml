services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dewdrop
      POSTGRES_PASSWORD: dewdrop
      POSTGRES_DB: dewdrop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dewdrop"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
